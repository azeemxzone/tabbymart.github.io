<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabbymart - Smart Shopping</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f8; color: #333; }
    
    header { background: #1e293b; color: white; padding: 20px; text-align: center; }
    header h1 { font-size: 1.8rem; letter-spacing: 1px; }
    header p { color: #94a3b8; font-size: 0.9rem; margin-top: 5px; }

    .container { max-width: 1200px; margin: 30px auto; padding: 0 15px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
    
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; transition: transform 0.2s; }
    .card:hover { transform: translateY(-3px); }
    .card img { max-width: 100%; height: 200px; object-fit: contain; border-radius: 8px; }
    .card h3 { font-size: 1.1rem; margin: 15px 0 10px; color: #0f172a; }
    .card .category { display: inline-block; background: #e2e8f0; color: #475569; font-size: 0.75rem; padding: 3px 10px; border-radius: 12px; margin-bottom: 15px; }

    .buy-links { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: bold; color: white; }
    .btn-amazon { background-color: #ff9900; color: #111; }
    .btn-flipkart { background-color: #2874f0; }
    .btn-meesho { background-color: #e91e63; }

    .qr-container { margin-top: 15px; padding-top: 15px; border-top: 1fr solid #f1f5f9; }
    .qr-container p { font-size: 0.75rem; color: #64748b; margin-bottom: 5px; }
    .qr-container img { width: 100px; height: 100px; }
  </style>
</head>
<body>

  <header>
    <h1>TABBYMART</h1>
    <p>Explore our multi-platform catalog available on Amazon, Flipkart & Meesho</p>
  </header>

  <div class="container">
    <div class="grid" id="productGrid">
      <!-- Demo Product Card -->
      <div class="card">
        <img src="https://via.placeholder.com/300" alt="Product Image">
        <h3>Facial Hair Epilator</h3>
        <span class="category">Personal Care</span>
        
        <div class="buy-links">
          <a href="https://www.amazon.in" target="_blank" class="btn btn-amazon">Buy on Amazon</a>
          <a href="https://www.flipkart.com" target="_blank" class="btn btn-flipkart">Buy on Flipkart</a>
          <a href="https://www.meesho.com" target="_blank" class="btn btn-meesho">Buy on Meesho</a>
        </div>

        <div class="qr-container">
          <p>Scan to buy on Amazon</p>
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://www.amazon.in" alt="QR Code">
        </div>
      </div>
    </div>
  </div>

</body>
</html>
